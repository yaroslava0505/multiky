<div class="cinema-home">
__BAR__
<div class="wrap">

<header class="cinema-hero">
  <div class="cinema-intro">
    <h1>Вечірня<br>прем’єра</h1>
    <a class="cinema-cta" href="#program-title">До каталогу <span aria-hidden="true">→</span></a>
  </div>
</header>

<main id="catalog">
  <div class="toolbar" aria-label="Пошук та фільтри">
    <form class="search" id="search-form" role="search">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle>
        <path d="M15 15l5 5"></path></svg>
      <input id="q" type="search" autocomplete="off"
        placeholder="Пошук мультфільму, теми або запиту…"
        aria-label="Пошук мультфільму">
      <button type="submit">Пошук</button>
    </form>
    <div class="quick-filters" role="group" aria-label="Фільтри каталогу">
      <details class="quick-filter">
        <summary>Вік <span class="filter-value">Усі вікові групи</span></summary>
        <div class="chips" id="f-age"></div>
      </details>
      <details class="quick-filter">
        <summary>Формат <span class="filter-value">Усі формати</span></summary>
        <div class="chips" id="f-fmt"></div>
      </details>
      <details class="quick-filter">
        <summary>Сервіс <span class="filter-value">Усі сервіси</span></summary>
        <div class="chips" id="f-service"></div>
      </details>
    </div>
  </div>

  <div class="theme-list" id="f-theme" role="group" aria-label="Теми для розмови"></div>

  <section class="cinema-program" aria-labelledby="program-title">
    <div class="program-heading">
      <h2 id="program-title"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 5h.01M19 10h.01M16 18h.01M8 18h.01M5 10h.01" fill="none" stroke="#fff8ee" stroke-width="3.2" stroke-linecap="round"/></svg> Кінопрограма</h2>
      <div class="chips" id="program-formats" role="group" aria-label="Добірки за форматом"></div>
    </div>
    <div class="catalog-utilities">
      <div class="tabs" role="group" aria-label="Список">
        <button type="button" data-tab="all" aria-pressed="true">Усі</button>
        <button type="button" data-tab="fav" aria-pressed="false">
          Збережені <span class="fav-count" id="fav-count">0</span>
        </button>
      </div>
      <button type="button" class="btn-random" id="random">Випадковий мультик</button>
      <details class="quick-filter category-filter">
        <summary>Категорії</summary>
        <div class="chips" id="f-cat"></div>
      </details>
    </div>
    <div class="result-bar">
      <p class="count" id="count" role="status" aria-live="polite"></p>
      <button type="button" class="reset" id="reset" hidden>Скинути фільтри</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty-title">За вашим запитом нічого не знайдено</p>
      <p>Спробуйте прибрати один із фільтрів або пошукати за іншою назвою.</p>
      <button type="button" class="btn-primary" id="reset-empty">Скинути фільтри</button>
    </div>
    <noscript>
      <p class="empty-title">Увімкніть JavaScript, щоб користуватися пошуком і фільтрами.</p>
      <p>Повний каталог також розкладений за темами на окремих сторінках:
        <a href="temy/druzhba/">дружба</a>, <a href="temy/pidtrymka/">підтримка</a>,
        <a href="temy/emotsii/">емоції</a>, <a href="temy/dobrota/">доброта</a>,
        <a href="temy/smilist/">смілість</a>, <a href="temy/simya/">сімʼя</a>,
        <a href="temy/buty-soboyu/">бути собою</a>, <a href="temy/vtrata/">втрата</a>.</p>
    </noscript>
  </section>
</main>
</div>
__FOOTER__
</div>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <button type="button" class="modal-close" id="modal-close" aria-label="Закрити">&times;</button>
  <div class="modal-body" id="modal-body"></div>
</dialog>

<script src="data.js"></script>
<script src="app.js?v=premiere"></script>
